version: '3.9'

services:
  db:
    image: postgres:14.3
    container_name: dyradb
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres:/var/lib/postgresql/data

  # Requerido (REDIS_URL): cola de correos y eventos del socket /tickets entre instancias.
  redis:
    image: redis:7.4-alpine
    container_name: dyraredis
    restart: always
    ports:
      - "6379:6379"
